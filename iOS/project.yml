name: SudokuApp
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  SudokuCore:
    path: ..
targets:
  SudokuApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SudokuApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SudokuApp
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: SudokuCore
        product: SudokuCore
  SudokuAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SudokuAppTests
    dependencies:
      - target: SudokuApp
      - package: SudokuCore
        product: SudokuCore
schemes:
  SudokuApp:
    build:
      targets:
        SudokuApp: all
    run:
      config: Debug
    test:
      targets:
        - SudokuAppTests
